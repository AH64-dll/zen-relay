# Home patch for the DeepSeek Harness — the only model route.
#
# Copy to $DSH_HOME/cordis.patch.yml (usually ~/.dsh/cordis.patch.yml).
# The relay key is NOT stored here: the Harness reads it from the credential
# store through `apiKeyEnv`, so this file stays safe to commit.
#
# Put the key in place once (the value is the `relay_api_key` from
# zen-router/settings.json):
#
#   dsh config credentials set OMP_ZEN_RELAY_KEY rly_...
#
# If your dsh build has no credentials CLI, export the variable in the unit:
#   Environment=OMP_ZEN_RELAY_KEY=rly_...
#
# baseURL must stay loopback when the Harness and the relay share a machine.
# For a relay on another host use https://<public-host>/v1 (see
# docs/OTHER-DEVICES.md).

- id: llm-pi-ai
  config:
    providers:
      opencode-zen:
        displayName: OpenCode Zen (local relay)
        api: openai-completions
        apiKeyEnv: OMP_ZEN_RELAY_KEY
        baseURL: http://127.0.0.1:8901/v1
        # Rotation makes most failures transient by construction; a spent IP is
        # per-lane, not account-wide. Retry QUOTA and AUTH too so a blocked lane
        # never ends the turn as "invalid API key".
        retryPolicy:
          mode: normal
          maxRetries: 8
          retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, QUOTA, AUTH]
          backoff:
            initialDelayMs: 800
            maxDelayMs: 20000
            jitterRatio: 0.25
        models:
          - id: deepseek-v4.1-flash-free
            name: DeepSeek V4.1 Flash (free)
            contextWindow: 200000
            input: [text, image]
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsStrictMode: true
              maxTokensField: max_tokens
              requiresReasoningContentOnAssistantMessages: true
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
          - id: mimo-v2.6-flash-free
            name: MiMo v2.6 Flash (free)
            contextWindow: 200000
            input: [text, image]
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsStrictMode: true
              maxTokensField: max_tokens
          - id: nemotron-3.5-lightning-free
            name: Nemotron 3.5 Lightning (free)
            contextWindow: 262144
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsStrictMode: true
              maxTokensField: max_tokens
          - id: nemotron-3.5-super-vl-free
            name: Nemotron 3.5 Super VL (free)
            contextWindow: 1048576
            input: [text, image]
          - id: glm-5.3-flash-free
            name: GLM 5.3 Flash (free)
            contextWindow: 200000
            input: [text, image]
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsStrictMode: true
              maxTokensField: max_tokens
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
          - id: minimax-m3.1-flash-free
            name: MiniMax M3.1 Flash (free)
            contextWindow: 1000000
            input: [text, image]
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsStrictMode: true
              maxTokensField: max_tokens
          - id: longcat-2.5-preview-free
            name: LongCat 2.5 Preview (free)
            contextWindow: 1000000
            input: [text, image]
          - id: beam-free
            name: Beam (free)
            contextWindow: 1048576

- id: agent-default-model
  config:
    provider: opencode-zen
    model: deepseek-v4.1-flash-free
