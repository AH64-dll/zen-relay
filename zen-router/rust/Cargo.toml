[package]
name = "zen-relay"
version = "1.1.9"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
